[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "container-damage-ai"
version = "0.1.0"
description = "AI inference pipeline for maritime and rail container inspections"
requires-python = ">=3.10"
dependencies = [
  "easyocr>=1.7.2",
  "opencv-python>=4.10.0",
  "requests>=2.32.0",
  "ultralytics>=8.3.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
include = ["ai*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["ai/tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
strict = true
